[project]
name = "sofia-task-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maksim", email = "maksym.mezhakov@student.tuke.sk" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sofia-task-router = "sofia.main:main"

